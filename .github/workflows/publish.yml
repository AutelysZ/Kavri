name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions
        id: bump
        run: |
          pnpm -r exec npm version ${{ inputs.release_type }} --no-git-tag-version
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/basic/package.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped all packages to $VERSION"

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest && npm version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions
        run: pnpm -r exec npm version ${{ inputs.release_type }} --no-git-tag-version

      - name: Build
        run: pnpm build

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${{ needs.validate.outputs.version }}"
          git tag v${{ needs.validate.outputs.version }}

      - name: Copy LICENSE to packages
        run: |
          for dir in packages/*/; do
            cp LICENSE "$dir"
          done

      - name: Debug auth
        run: npm whoami --registry https://registry.npmjs.org || echo "not logged in"

      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance --verbose
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Push commit and tag
        run: git push origin HEAD --tags

      - name: Create GitHub Release
        run: |
          gh release create v${{ needs.validate.outputs.version }} \
            --title "v${{ needs.validate.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
